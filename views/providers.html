<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookly - Find a Provider</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

  <header class="header">
    <a href="/" class="logo">Bookly</a>
    <nav class="nav">
      <a href="/">Dashboard</a>
      <a href="/providers.html" class="active">Find a Provider</a>
      <a href="/Appointments.html">My Appointments</a>
    </nav>
    <div class="profile-menu">
      <button type="button" class="profile-trigger" id="profile-trigger">
        <span class="profile-avatar" id="profile-avatar">--</span>
        <span class="profile-caret">&#9662;</span>
      </button>
      <div class="profile-dropdown" id="profile-dropdown">
        <a href="/profile.html">My Profile</a>
        <a href="/profile.html#notifications">Notification Settings</a>
        <a href="/forgot-password.html">Change Password</a>
        <hr />
        <button type="button" class="logout" data-action="logout">Log Out</button>
      </div>
    </div>
  </header>

  <main class="page">
    <h1>Find a provider</h1>

    <input
      type="text"
      id="provider-search"
      class="search-input"
      placeholder="Search Provider or Specialty"
    />

    <div class="finder-grid">
      <section>
        <h2>Providers</h2>
        <div class="provider-list" id="provider-list">
          <!-- provider cards injected by script.js -->
        </div>
      </section>

      <section>
        <h2 id="times-heading">Available Times</h2>
        <div class="date-picker hidden" id="date-picker">
          <button type="button" class="date-picker-trigger" id="date-picker-trigger" aria-haspopup="true">
            <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="2" />
              <path d="M3 9h18" stroke="currentColor" stroke-width="2" />
              <path d="M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span id="date-picker-label">Select a date</span>
            <span class="date-picker-caret">&#9662;</span>
          </button>
          <div class="date-picker-panel" id="date-picker-panel">
            <div class="date-picker-header">
              <button type="button" class="date-picker-nav" id="date-picker-prev" aria-label="Previous month">&lsaquo;</button>
              <span id="date-picker-month-label"></span>
              <button type="button" class="date-picker-nav" id="date-picker-next" aria-label="Next month">&rsaquo;</button>
            </div>
            <div class="date-picker-grid" id="date-picker-grid"></div>
          </div>
        </div>
        <div class="times-grid" id="times-grid">
          <!-- time slots injected by script.js -->
        </div>
        <label class="field-label" for="reason-input">Reason for visit</label>
        <textarea
          id="reason-input"
          class="reason-input"
          rows="3"
          placeholder="Briefly describe why you're booking this appointment"
        ></textarea>
        <button type="button" class="btn-book" id="book-btn" disabled>Book Appointment</button>
      </section>
    </div>
  </main>

  <script src="/script.js"></script>
</body>
</html>
